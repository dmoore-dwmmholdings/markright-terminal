name: MarkrightEditorSpike
options:
  bundleIdPrefix: com.dwmm.markright.spike
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  MarkrightEditorSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../fixtures/calculator-static.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwmm.markright.spike.editor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: build/Generated-Info.plist
      properties:
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown source
            UTTypeConformsTo: [public.utf8-plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.dwmm.markright.spike.source
            UTTypeDescription: Markright source
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mrk]
  MarkrightEditorSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../fixtures/bitfields-0.1.json
        buildPhase: resources
    dependencies:
      - target: MarkrightEditorSpike
  MarkrightEditorSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MarkrightEditorSpike
schemes:
  MarkrightEditorSpike:
    build:
      targets:
        MarkrightEditorSpike: all
    test:
      targets: [MarkrightEditorSpikeTests, MarkrightEditorSpikeUITests]
