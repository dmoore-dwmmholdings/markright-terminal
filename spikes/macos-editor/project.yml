name: MarkrightMacEditorSpike
options:
  bundleIdPrefix: com.dwmm.markright.spike
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  MarkrightMacEditorSpike:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../ios-editor/Sources/EditorModel.swift
      - path: ../ios-editor/Sources/SourceSelection.swift
      - path: ../ios-editor/Sources/CollectionSearch.swift
      - path: ../ios-editor/Sources/CollectionSearchModel.swift
      - path: ../ios-editor/Sources/CollectionSearchPanel.swift
      - path: ../ios-editor/Sources/CollectionStore.swift
      - path: ../ios-editor/Sources/RecoveryDraft.swift
      - path: ../ios-editor/Sources/DocumentSession.swift
      - path: ../ios-editor/Sources/SourceCopyExport.swift
      - path: ../ios-editor/Sources/SourceCopyTransfer.swift
      - path: ../ios-editor/Sources/SourceCopyExporter.swift
      - path: ../ios-editor/Sources/MarkdownInsertion.swift
      - path: ../ios-editor/Sources/MarkdownTableInsertion.swift
      - path: ../ios-editor/Sources/SourcePreviewProjection.swift
      - path: ../ios-editor/Sources/SourcePreviewPanel.swift
      - path: Resources/Editor
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwmm.markright.spike.macos-editor
        PRODUCT_NAME: MarkrightMacEditorSpike
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Markright macOS research
    info:
      path: build/Generated-Info.plist
      properties:
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown source
            UTTypeConformsTo: [public.utf8-plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.dwmm.markright.spike.source
            UTTypeDescription: Markright source
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mrk]
schemes:
  MarkrightMacEditorSpike:
    build:
      targets:
        MarkrightMacEditorSpike: all
